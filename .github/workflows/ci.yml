name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: "10.33.0"
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/utils' video-probe.test.ts shells out to a real ffprobe
      # (ROADMAP.md 2.7) — not pre-installed on the runner, and not
      # something worth mocking (CODESTYLE.md §14).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test -- --coverage

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/workers' GIF/video transcoders (ROADMAP.md 2.7) shell out to a
      # real ffmpeg/ffprobe, isolated per-run via prlimit(1) — already part
      # of util-linux on this runner, ffmpeg itself is not.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Runner ships Docker — Testcontainers spins up real Postgres, Redis,
      # Redpanda (ROADMAP.md 3.1) and Mailpit per suite; CODESTYLE.md §14
      # forbids mocking them.
      - run: pnpm --filter @x/api test:integration
      - run: pnpm --filter @x/workers test:integration
      - run: pnpm --filter @x/ws-gateway test:integration
      - run: pnpm --filter @x/db test:integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @x/web exec playwright install --with-deps chromium
      # apps/web/e2e/global-setup.ts spins up real Postgres, Redis, MinIO and
      # Mailpit (Testcontainers, same as the integration jobs above) plus real
      # apps/api, apps/workers and apps/web processes — SPECS.md §17.1's
      # "Registro, publicar, seguir, notificaciones" against the actual stack,
      # not a mock of it.
      - run: pnpm --filter @x/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-web
          path: apps/web/playwright-report/
          retention-days: 7
      # apps/admin/e2e/global-setup.ts's own comment explains why this one's
      # leaner than apps/web's above (real apps/api only, no apps/workers/
      # ws-gateway — moderation lives entirely in apps/api). Sequential with
      # the step above, not parallel — same runner, same ports (3001 for
      # apps/api in both) — but that's fine: apps/web's own global-setup
      # already tore its stack all the way down before this one starts.
      - run: pnpm --filter @x/admin test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-admin
          path: apps/admin/playwright-report/
          retention-days: 7

  contracts:
    name: Contract drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @x/api generate:openapi
      - run: pnpm --filter @x/sdk generate
      # If the committed openapi.json / types.gen.ts don't match what the API
      # actually serves, packages/sdk was not regenerated before commit —
      # ROADMAP.md 0.5 "si el schema cambia de forma incompatible, el build falla".
      - run: git diff --exit-code -- packages/sdk/openapi.json packages/sdk/src/types.gen.ts

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high || true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test, integration, e2e, contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Docker build & scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [quality, test, integration, e2e, contracts]
    strategy:
      matrix:
        app: [api, web, admin, workers, ws-gateway]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: x-${{ matrix.app }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: x-${{ matrix.app }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      # Non-distroless-but-locked-down base (node:22-slim), non-root user in
      # both Dockerfiles — a CRITICAL/HIGH finding here is either an upstream
      # base-image CVE (bump the tag) or ours (fix before merging), never
      # something to silently allow.
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag x-${{ matrix.app }}:${{ github.sha }} ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          docker tag x-${{ matrix.app }}:${{ github.sha }} ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
          docker push ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
