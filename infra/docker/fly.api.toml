# Fly.io app config for @x/api — SPECS.md §2.4 names Fly.io as the early-phase
# choice over Kubernetes, before the operational cost of the latter is
# justified by real traffic (docs/adr/0001-monolito-modular.md).
#
# Deployed by .github/workflows/deploy.yml on every push to main, once
# `fly apps create x-api-staging` has been run once by a human and
# FLY_API_TOKEN is set as a repo secret.
app = "x-api-staging"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  API_PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
